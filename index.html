<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LatticeOS</title>
<style>
:root{color-scheme:dark;--bub:#2c2c2c;--bg:#0d1017;--fg:#eee;--mut:#777;--line:#444}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg.drag{cursor:grabbing}
.bar{position:fixed;top:10px;left:10px;display:flex;gap:6px;z-index:2}
button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--fg)}
input{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:4px 8px;width:140px}
#msg{position:fixed;bottom:10px;left:10px;right:10px;color:var(--mut)}
.n{cursor:pointer}
.pos{position:fixed;top:10px;right:10px;z-index:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pos .row{display:flex;gap:6px}
#xy{border:1px solid var(--line);padding:4px 10px;background:var(--bg);white-space:pre}
input[type=color]{width:26px;height:22px;padding:0;border:1px solid var(--line);background:none;cursor:pointer}
.colors{gap:10px;flex-wrap:wrap;justify-content:flex-end}
.colors label{display:flex;align-items:center;gap:4px;color:var(--mut)}
#settings{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
#settings[hidden]{display:none}
#panel{background:var(--bg);border:1px solid var(--line);padding:16px 20px;min-width:280px;display:flex;flex-direction:column;gap:12px}
#panel h2{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center}
#panel .sec{color:var(--mut);margin-top:4px;border-bottom:1px solid var(--line);padding-bottom:2px}
#panel .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#panel input:not([type=color]){flex:1}
#panel .sub{color:var(--mut);font-size:11px}
#online{color:var(--mut)}
#hint{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);border:1px solid var(--line);background:var(--bg);padding:4px 10px;z-index:2}
.n.near .ic{filter:drop-shadow(0 0 4px #fff)}
.n rect{fill:transparent;stroke:none}
.n:hover .ic{opacity:.65}
.n.root text,.n.bucket text{font-weight:bold}
.n text{fill:var(--ic,var(--fg));dominant-baseline:central;text-anchor:middle;pointer-events:none}
#lines path{fill:none;stroke:var(--line)}
.ic path{fill:none;stroke:var(--ic,var(--line))}
/* light mode (Settings > Appearance) */
:root.light{color-scheme:light;--bub:#e9e9e9;--bg:#fff;--fg:#111;--mut:#666;--line:#bbb}
.light .n:not(.root) .ic{fill:#fff}
.light .n.near .ic{filter:drop-shadow(0 0 4px #000)}
.light #settings{background:rgba(255,255,255,.6)}
.light .win{box-shadow:0 8px 30px #0003}
.light .win .tb{background:#eee}
.light .md code{background:#eee}
.light .md pre.code{background:#f5f5f5}
.light .md th{background:#eee}
.light .md blockquote{color:#555}
.light .md a{color:#06c}
.light .up .pick{background:#f5f5f5}
.light .up .trow:hover{background:#eee}
.light .up button.go{color:var(--fg)}
.light .t-cm{color:#2e7d32}.light .t-st{color:#b4532a}.light .t-nm{color:#2e7d32}.light .t-kw{color:#a626a4}.light .t-fn{color:#795e26}
.light .t-ty{color:#1a7f6e}.light .t-at,.light .t-vr,.light .t-tg{color:#0451a5}
#boot{position:fixed;inset:0;z-index:9500;background:#000;color:#cfcfcf;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:18px 22px;box-sizing:border-box;overflow:hidden;transition:opacity .7s ease,transform .7s ease,filter .7s ease}
#boot.out{opacity:0;transform:scale(1.15);filter:blur(4px);pointer-events:none}
#bootscroll{height:100%;overflow:hidden;white-space:pre-wrap;word-break:break-all}
#bootscroll div{min-height:1.45em}
#bootscroll .ok{color:#3dd16f}
#bootscroll .dim{color:#7d7d7d}
#bootscroll .hi{color:#fff;font-weight:bold}
#bootscroll .cur{display:inline-block;width:.6em;height:1.1em;vertical-align:text-bottom;background:#cfcfcf;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* file viewer windows */
.win{position:fixed;z-index:100;width:520px;height:380px;min-width:240px;min-height:120px;max-width:96vw;max-height:92vh;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;resize:both;overflow:hidden;box-shadow:0 8px 30px #000a}
.win .tb{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--line);background:#1a1a1a;cursor:move;user-select:none;touch-action:none}
.win .dot{width:9px;height:9px;border-radius:50%;flex:none}
.win .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .tb button{padding:1px 8px;flex:none}
.win .bd{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center}
.win pre{margin:0;padding:10px;align-self:flex-start;width:100%;box-sizing:border-box;white-space:pre-wrap;word-break:break-word;font:inherit;user-select:text}
.win img,.win video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.win audio{width:90%}
.win iframe{width:100%;height:100%;border:0;background:#fff}
.win .st{color:var(--mut);padding:10px;text-align:center}
/* viewer extras: counter, syntax colors, rendered markdown */
.win .cnt{color:var(--mut);font-size:11px;flex:none}
.t-cm{color:#6a9955}.t-st{color:#e6a07a}.t-nm{color:#b5cea8}.t-kw{color:#c586c0}.t-fn{color:#dcdcaa}
.t-ty{color:#4ec9b0}.t-at{color:#9cdcfe}.t-tg{color:#569cd6}.t-vr{color:#9cdcfe}
.win .md{padding:14px 18px;align-self:flex-start;width:100%;box-sizing:border-box;line-height:1.55;user-select:text;word-break:break-word}
.md h1,.md h2,.md h3,.md h4{margin:1em 0 .5em;line-height:1.25}
.md h1{font-size:1.7em;border-bottom:1px solid var(--line);padding-bottom:.25em}
.md h2{font-size:1.4em;border-bottom:1px solid var(--line);padding-bottom:.2em}
.md h3{font-size:1.2em}.md h4,.md h5,.md h6{font-size:1em}
.md>:first-child{margin-top:0}
.md p{margin:.6em 0}
.md code{background:#242424;padding:1px 5px;border-radius:3px}
.md pre.code{background:#0b0b0b;border:1px solid var(--line);padding:10px;overflow:auto;white-space:pre;margin:.8em 0;width:auto;align-self:auto}
.md blockquote{margin:.8em 0;padding:0 12px;border-left:3px solid #ff0044;color:#bbb}
.md table{border-collapse:collapse;margin:.8em 0}
.md th,.md td{border:1px solid var(--line);padding:4px 10px}
.md th{background:#1c1c1c}
.md a{color:#6cf}
.md img{max-width:100%}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md ul,.md ol{padding-left:22px;margin:.5em 0}
/* upload window */
.win .bd.up{display:block;padding:12px;font-size:12px}
.up .sec{color:var(--mut);margin:12px 0 6px;border-bottom:1px solid var(--line);padding-bottom:2px}
.up .sec:first-child{margin-top:0}
.up .pick{border:1px solid var(--line);max-height:190px;overflow:auto;padding:6px;background:#0c0c0c}
.up .tr .tr{margin-left:9px;padding-left:9px;border-left:1px solid var(--line)}
.up .trow{display:flex;align-items:center;gap:7px;padding:2px 6px;cursor:pointer;white-space:nowrap}
.up .trow:hover{background:#222}
.up .trow.sel{background:#ff004426;outline:1px solid #ff0044}
.up .dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.up .brow{margin-top:8px;color:var(--mut)}
.up .brow[hidden]{display:none}
.up select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:2px 4px}
.up .dest{margin:8px 0 0}
.up .nf{display:flex;gap:6px;margin-top:8px}
.up .nf input{flex:1;width:auto;min-width:0}
.up .nfs{margin-top:4px;color:var(--mut);min-height:1.2em}
.up .nfs.err{color:#ff6b6b}
.up .drop{border:1px dashed var(--line);padding:16px;text-align:center;color:var(--mut);cursor:pointer}
.up .drop.over{border-color:#ff0044;color:var(--fg)}
.up .fl{margin-top:8px;display:flex;flex-direction:column;gap:3px;max-height:140px;overflow:auto}
.up .fr{display:flex;gap:8px;align-items:center}
.up .fr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .fr .stt{color:var(--mut);flex:none}
.up .fr .stt.ok{color:#3dd16f}.up .fr .stt.err{color:#ff6b6b}
.up .fr button{padding:0 6px}
.up .act{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin-top:14px}
.up .act label{display:flex;align-items:center;gap:8px;color:var(--mut);cursor:pointer}
.up input[type=checkbox]{width:14px;height:14px;padding:0;margin:0;accent-color:#ff0044;cursor:pointer}
.up input[type=file]{display:none}
.up button.go{padding:7px 10px}
.up button.go{border-color:#ff0044;color:#fff}
.up button:disabled{opacity:.4;cursor:default}
/* add-file cinematic */
#cine{position:fixed;inset:0;z-index:8500;pointer-events:none}
#cine .bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s cubic-bezier(.2,.7,.2,1)}
#cine .top{top:0}
#cine .bot{bottom:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cine.on .bar{height:11vh}
#cine .vig{position:absolute;inset:0;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse at center,transparent 45%,#000b 100%)}
#cine.on .vig{opacity:1}
#cine .flash{position:absolute;inset:0;background:#fff;opacity:0}
#cine .flash.go{animation:cflash .6s ease-out}
.cinef #hint,.cinef #msg{opacity:0;transition:opacity .3s}
@keyframes cflash{0%{opacity:var(--fo,.55)}100%{opacity:0}}
#ctext{color:#fff;letter-spacing:.12em;font-size:15px;white-space:pre}
#toast{position:absolute;top:14px;left:50%;transform:translate(-50%,-90px);border:1px solid #ff0044;background:var(--bg);padding:6px 14px;transition:transform .4s;max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
.n.ping .ic{animation:nping .9s ease-out var(--d,0ms) both}
@keyframes nping{0%{filter:none}35%{filter:drop-shadow(0 0 8px #ff0044) brightness(1.9)}100%{filter:none}}
.n.pop{transform-box:fill-box;transform-origin:center;animation:npop .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes npop{0%{opacity:0;transform:scale(.1)}55%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
.n.root.near .ic{filter:drop-shadow(0 0 6px #ff0044)}
@media (prefers-reduced-motion:reduce){.n.ping .ic,.n.pop{animation:none}}
/* idle flicker for the LatticeOS root icon: still most of the time, a rare tiny stutter */
.n.root .glitch{animation:rglitch 5.3s steps(1,end) infinite}
@keyframes rglitch{
  0%,90%,100%{opacity:1;transform:none}
  91%{opacity:.6}
  92%{opacity:1;transform:translate(.7px,0)}
  93%{opacity:.8;transform:none}
  94%{opacity:1}
}
@media (prefers-reduced-motion:reduce){.n.root .glitch{animation:none}}
/* accounts + delete */
#amsg{min-height:1.2em}
#ctx{position:fixed;z-index:9100;background:var(--bg);border:1px solid var(--line);padding:0;display:flex;flex-direction:column;min-width:210px;max-width:280px}
#ctx .tb{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--line);background:#1a1a1a;user-select:none}
.light #ctx .tb{background:#eee}
#ctx .dot{width:9px;height:9px;border-radius:50%;flex:none}
#ctx .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ctx .tb button{padding:1px 8px;flex:none}
#ctx .cb{padding:6px;display:flex;flex-direction:column;gap:6px}
#ctx[hidden]{display:none}
.n.priv text{font-style:italic}
.n.carried{opacity:.3}
#ctx input{background:var(--bg);color:inherit;border:1px solid var(--line);padding:3px 5px;font:inherit;min-width:0}
#ctx .ap{display:flex;gap:4px;align-items:center;font-size:11px}#ctx .ap span{flex:1;overflow:hidden;text-overflow:ellipsis}
#ctx .t{color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ctx button.danger,.win .tb button.danger{border-color:#ff0044;color:#ff0044}
/* proximity chat bar (press /) */
#chatbar{position:fixed;left:0;right:0;bottom:0;z-index:9200;display:flex;align-items:center;gap:8px;background:#000;color:#fff;border-top:1px solid #444;padding:9px 12px}
#chatbar[hidden]{display:none}
#chatbar .pre{color:#ff0044;flex:none}
#chatbar input{flex:1;width:auto;min-width:0;background:#000;color:#fff;border:0;outline:0;padding:2px 0}
#chatbar .cnt{color:#777;font-size:11px;flex:none}
.chatting #hint,.chatting #msg{display:none}
/* districts */
#dists{pointer-events:none}
#ctx input[type=color]{width:30px;height:24px;padding:0;flex:none;cursor:pointer}
#ctx select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:2px 4px;min-width:0}
/* home folders: the room + its editor window */
/* footsteps: a white, mostly transparent # (opacity is set in JS, max STEP_ALPHA) */
#steps text{fill:#fff;font-size:9px;font-weight:bold;text-anchor:middle;dominant-baseline:central;pointer-events:none}
:root.light #steps text{fill:#000}   /* light mode: transparent black instead */
.rbg{fill:var(--bg);stroke:var(--line);stroke-width:1}
svg{transition:background .6s ease}
#dists,#lines,#nodes,#rooms>g{transition:opacity .6s ease}
:root.inhome svg{background:#000}
:root.light.inhome svg{background:var(--bg)}
:root.inhome #dists,:root.inhome #lines,:root.inhome #nodes,:root.inhome #rooms>g:not(.cur){opacity:0;pointer-events:none}
.up .hrow{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.up textarea{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:4px 6px;width:100%;box-sizing:border-box;resize:vertical;min-height:54px}
.up .hil{max-height:110px;overflow:auto;border:1px solid var(--line)}
.up .hit{padding:2px 6px;cursor:pointer;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.up .hit:hover{background:#222}.light .up .hit:hover{background:#eee}
.up .hit.sel{background:#ff004426;outline:1px solid #ff0044}
.up .hst{color:var(--mut);min-height:1.2em;margin-top:6px}
.up .hst.err{color:#ff6b6b}
.up button.danger{border-color:#ff0044;color:#ff0044}
.up input[type=range]{width:150px;padding:0}
</style>
</head>
<body>
<div id="boot"><div id="bootscroll"></div></div>
<div class="bar">
  <button id="ctr">Me</button>
  <button id="fit">Fit</button>
  <button id="all">Expand all</button>
  <button id="in">+</button>
  <button id="out">&minus;</button>
  <input id="bk" placeholder="bucket name" hidden>
  <button id="addbk" hidden>Add bucket</button>
</div>
<div class="pos">
  <div id="xy">x: 0   y: 0</div>
  <div id="online">online: 1</div>
  <div class="sub" style="color:var(--mut)">Esc: settings</div>
  <div class="sub" style="color:var(--mut)">/: chat</div>
</div>
<div id="settings" hidden>
  <div id="panel">
    <h2>Settings <button id="closeset">Close (Esc)</button></h2>
    <div class="sec">Appearance</div>
    <div class="row"><button id="lightmode">Light mode: off</button><button id="sndbtn">Sound: on</button></div>
    <div class="sec">Player</div>
    <div class="row"><input id="name" placeholder="display name" maxlength="16"></div>
    <div class="sec">Account</div>
    <div id="acct-out">
      <div class="row"><input id="au" placeholder="username" maxlength="16" autocomplete="username" autocapitalize="off" spellcheck="false"><input id="ap" type="password" placeholder="password" autocomplete="current-password"></div>
      <div class="row" style="margin-top:8px"><button id="alogin">Log in</button><button id="asign">Sign up</button></div>
    </div>
    <div id="acct-in" hidden>
      <div class="row"><span id="awho"></span><button id="alogout">Log out</button></div>
      <div class="row" style="margin-top:8px"><input id="newname" placeholder="new username" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="arename">Change username</button></div>
    </div>
    <div class="sub" id="amsg"></div>
    <div class="sec">Colors</div>
    <div class="row colors">
      <label>head <input type="color" id="c-head"></label>
      <label>body <input type="color" id="c-body"></label>
      <label>left foot <input type="color" id="c-footL"></label>
      <label>right foot <input type="color" id="c-footR"></label>
    </div>
    <div class="row"><button id="feetsync">Match feet</button><button id="resetc">Reset colors</button></div>
    <div class="sec">Teleport</div>
    <div class="row"><input id="go" placeholder="x, y"><button id="gob">Go</button></div>
  </div>
</div>
<svg id="svg"><g id="cam"><g id="dists"></g><g id="rooms"></g><g id="steps"></g><g id="lines"></g><g id="nodes"></g></g></svg>
<div id="hint" hidden></div>
<div id="cine"><div class="bar top"></div><div class="bar bot"><span id="ctext"></span></div><div class="vig"></div><div class="flash"></div><div id="toast"></div></div>
<div id="msg"></div>
<div id="chatbar" hidden><span class="pre">say&gt;</span><input id="chatin" maxlength="120" autocomplete="off" spellcheck="false" placeholder="nearby players will see this above your head (Enter to send, Esc to cancel)"><span class="cnt" id="chatcnt">0/120</span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ---- Fill these in ----
const CFG = {
  URL: "https://epmfmzqmwpzpezqiiwvi.supabase.co",
  KEY: "sb_publishable_tdDeJbMVLHdI3M4N0q6-tg_G6FStIJ-",
  NAME: "LatticeOS",
  BUCKETS: [],  // optional, e.g. ["files","avatars"]; empty = list all buckets
  HOME: "",     // optional: the bucket whose top level shows directly under the LatticeOS icon (empty = first bucket)
  AUTH_DOMAIN: "latticeos.app"  // accounts need no email: username "bob" is stored as bob@AUTH_DOMAIN behind the scenes
};
// -----------------------

const NW = 130, NH = 54, HG = 16, VG = 36, FG = 10, ROOM = 240, OLDROOM = 520;   // ROOM = side of a Home's square (OLDROOM = size before v2, used to rescale old homes)
const $ = id => document.getElementById(id);
const svg = $("svg"), cam = $("cam"), LN = $("lines"), ND = $("nodes"), DS = $("dists"), RM = $("rooms"), msg = $("msg");
const NS = "http://www.w3.org/2000/svg";
let sb, root, view = { x: 0, y: 0, k: 1 }, moved = false;
const manual = [], REFRESH_MS = 500;
const P = { x: -110, y: 60 }, keys = new Set(), flat = [], SPEED = 170, SC = 0.6;
const DEF_ZOOM = 2.5;
let carry = null, carryBusy = false;   // the file I am holding: { bucket, path, name }
let homeCam = false, booting = true, follow = true, target = null, near = null, face = { x: 0, y: 1 };

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const mk = (name, type, bucket, path, meta) =>
  ({ name, type, bucket, path, meta, children: null, open: false, loading: false, files: [], dirs: [] });

// The "home" bucket's top level is shown directly under the LatticeOS icon (no folder for the bucket itself).
let HOME = "";
const bname = b => (b === HOME && root ? root.name : b);   // what to call a bucket on screen
async function listDir(bucket, path) {
  const out = [];
  for (let off = 0; off < 1000; off += 200) {
    const { data, error } = await sb.storage.from(bucket)
      .list(path, { limit: 200, offset: off, sortBy: { column: "name", order: "asc" } });
    if (error) throw error;
    data.forEach(f => {   // a folder holding .home-data.json is a Home folder
      if (f.name === ".home-data.json" && f.id !== null) { const m = f.metadata || {}; out.home = true; out.homeVer = [f.updated_at || "", m.eTag || "", m.size || ""].join("|"); }
    });
    data.filter(f => f.name !== ".emptyFolderPlaceholder" && !f.name.startsWith(".home-") && canSee(bucket, path ? path + "/" + f.name : f.name, f.id === null)).forEach(f =>
      out.push(mk(f.name, f.id === null ? "folder" : "file", bucket,
        path ? path + "/" + f.name : f.name, f)));
    if (data.length < 200) break;
  }
  return out;
}
async function fetchKids(n) {
  let kids = [];
  if (n.type === "root") {
    let names = CFG.BUCKETS.slice();
    if (!names.length) {
      const { data, error } = await sb.storage.listBuckets();
      if (error) throw error;
      names = data.map(b => b.name);
    }
    if (CFG.HOME && !names.includes(CFG.HOME)) names.push(CFG.HOME);
    names = names.concat(manual.filter(m => !names.includes(m)));
    HOME = CFG.HOME || names[0] || "";
    if (HOME) kids = await listDir(HOME, "");
    names.filter(b => b !== HOME).forEach(b => kids.push(mk(b, "bucket", b, "")));
  } else {
    kids = await listDir(n.bucket, n.path);
  }
  kids.forEach(k => (k.parent = n));
  return kids;
}

async function load(n) {
  if (n.children || n.loading) return;
  n.loading = true; draw();
  try {
    const kids = await fetchKids(n);
    n.children = kids;
    if (n.type === "folder") applyHome(n, kids);
    if (!n.children.length && n.type === "bucket")
      msg.textContent = "Bucket \"" + n.name + "\" returned no items. It is empty, or the storage.objects policy is missing.";
  } catch (e) {
    msg.textContent = "Could not load " + n.name + ": " + e.message;
    n.children = [];
  }
  n.loading = false;
}

async function refresh(n) {
  if (!n.children) return false;
  let fresh;

  const old = new Map(n.children.map(c => [key(c), c]));
  let changed = fresh.length !== n.children.length;
  if (n.type === "folder" && applyHome(n, fresh)) changed = true;
  n.children = fresh.map(c => {
    const o = old.get(key(c));
    if (o) return o;
    changed = true;
    return c;
  });
  for (const c of n.children) {
    if (c.type === "file") continue;
    if (!c.children) { await expandAll(c); changed = true; }
    else if (await refresh(c)) changed = true;
  }

    // am I standing inside the square of an open Home?
    let inRoom = null;
    for (const n of flat) {
      const r = n.room;
      if (r && n.isHome && n.open && ox >= r.x0 && ox <= r.x1 && oy >= r.y0 && oy <= r.y1) { inRoom = n; break; }

    const rh = inRoom ? rhash(inRoom) : "";
    if (inRoom !== myRoom || rh !== myRH) { myRoom = inRoom; myRH = rh; roomChanged(); }

    if (live) {
      const mp = myPos();
      if ((mp.x !== sentX || mp.y !== sentY) && t - lastSent > 150) {
        chan.send({ type: "broadcast", event: "pos", payload: { id: myId, x: mp.x, y: mp.y, room: mp.room, k: carry ? carry.name.slice(0, 40) : "" } });
        sentX = mp.x; sentY = mp.y; lastSent = t; dirty = true;

    for (const o of others.values()) {
      // inside a Home you only see the people inside the same Home; outside, you only see people who are outside
      const same = !!(myRoom && o.room && o.room === myRH);
      const vis = canSeeO(o);
      let tx = o.x, ty = o.y;
      if (same) { tx += myRoom.room.x0 - root.x; ty += myRoom.room.y0 - root.y; }   // their spot is relative to the room
      if (o.fr !== same) { o.rx = tx; o.ry = ty; o.fr = same; }

      const f = Math.min(1, dt * 12), px0 = o.rx, py0 = o.ry;

      stepChar(o.ch, o.rx, o.ry, (o.rx - px0) / (dt || 0.016), (o.ry - py0) / (dt || 0.016), dt || 0.016);
      if (vis) {   // their footsteps, only while we can see them

      if (d < (isRoot ? 56 : 40) && d < bd) { bd = d; best = n; }
    }
    if (best !== near) {
      if (near && near.g) near.g.classList.remove("near");
      near = best;
      if (near && near.g) near.g.classList.add("near");
      updHint();
    }
  }
  requestAnimationFrame(tick);
}

let me = null;                       // { id, name } while logged in

async function loadOwners() {
  if (!sb) return false;
  const m = new Map();
  try {
    for (let off = 0; off < 100000; off += 1000) {
      const { data, error } = await sb.rpc("lattice_owners").range(off, off + 999);
      if (error) throw error;
      for (const r of data) m.set(r.bucket + "/" + r.path, r);
      if (data.length < 1000) break;
    }
  } catch (e) {
    ownersOk = false;
    if (!ownersWarned) { ownersWarned = true; msg.textContent = "Could not read who owns what. Run latticeos-accounts.sql in Supabase first (" + (e.message || e) + ")"; }
    return false;
  }
  const sm = new Map();
  try { const { data, error } = await sb.rpc("lattice_shares"); if (error) throw error; for (const r of data) sm.set(r.bucket + "/" + r.path, r); sharesOk = true; } catch (e) { sharesOk = false; }
  if (extraTick++ % 4 === 0) {
    try {
      const { data, error } = await sb.rpc("lattice_districts"); if (error) throw error;
      const dm = new Map(); for (const r of data) if (HEX.test(r.color)) dm.set(r.bucket + "/" + r.path, r);
      distRows = dm; distOk = true;
    } catch (e) { distOk = false; distRows = new Map(); }
    try { const { data, error } = await sb.rpc("lattice_viewers"); if (error) throw error; viewRows = data; viewersOk = true; }
    catch (e) { viewersOk = false; viewRows = []; }
  }
  sm.forEach(r => { r.viewers = []; });
  viewRows.forEach(v => { const r = sm.get(v.bucket + "/" + v.path); if (r) r.viewers.push({ id: v.user_id, name: v.user_name }); });
  let sig = ""; m.forEach((r, k) => { sig += k + "\u0001" + r.owner + "\u0002"; });
  sm.forEach((r, k) => { sig += "P" + k + r.owner + (r.approved || []).map(a => a.id).join(",") + "\u0002"; });
  shares.clear(); sm.forEach((v, k) => shares.set(k, v));
  closeBlocked();
  sm.forEach((r, k) => { sig += "V" + k + r.viewers.map(a => a.id).join(","); });
  distRows.forEach((r, k) => { sig += "D" + k + r.color + (r.label || ""); });

}

function ownedBy(n) {

  if (n.type === "folder") return owners.get(n.bucket + "/" + n.path + "/.emptyFolderPlaceholder");

// close viewer windows for files you can no longer read (logged out, approval removed, made private)
function closeBlocked() {
  for (const [k, w] of [...wins]) if (w._n && !canRead(w._n.bucket, w._n.path)) closeWin(k);
}
function canEditPath(b, p) { const cv = coverRows(b, p); return !cv.some(r => !inList(r)) && (isMine(owners.get(b + "/" + p)) || cv.length > 0); }
function canDelete(n) { return canEditPath(n.bucket, n.type === "folder" ? n.path + "/.emptyFolderPlaceholder" : n.path); }
async function shareCall(fn, args) {
  const { error } = await sb.rpc(fn, args);
  if (error) { msg.textContent = (error.message || error) + (/district|viewer/.test(fn) ? " (did you run latticeos-update-2.sql?)" : " (did you run latticeos-private.sql?)"); return false; }
  extraTick = 0;
  await loadOwners(); if (root && !cine) draw(); return true;
}
function syncDel() { for (const [k, w] of [...wins]) { if (w._del && w._n) w._del.hidden = !canDelete(w._n); if (w._home && !canDelete(w._home)) closeWin(k); } }
function updHint() {
  const h = $("hint");
  if (!near && myRoom) {
    h.hidden = false;
    h.textContent = "Inside " + myRoom.name + ": only people in this home can see you" + (canDelete(myRoom) ? "   |   H to edit" : "");
    return;
  }
  if (!near && carry) { h.hidden = false; h.textContent = "Carrying " + carry.name + ": walk to a folder and press Q to drop it in"; return; }
  h.hidden = !near;
  if (!near) return;
  let t = near.type === "root" ? (me ? "Press E to add files or folders" : "Press E to log in and add files")
    : "Press E to " + (near.type !== "file" && near.open ? "close " : "open ") + near.name;
  if (canDelete(near)) t += "   |   Del to delete";
  if (carry) t += carryDest(near) ? "   |   Q to drop " + carry.name + " here" : "   |   Q to put " + carry.name + " back";
  else if (near.type === "file" && me && canDelete(near)) t += "   |   Q to pick up";
  h.textContent = t;
}

// right-click (or Del when standing next to something) opens a tiny menu
const ctxEl = document.createElement("div");
ctxEl.id = "ctx"; ctxEl.hidden = true; document.body.appendChild(ctxEl);
function hideCtx() { ctxEl.hidden = true; ctxEl.replaceChildren(); }
addEventListener("pointerdown", e => { if (!ctxEl.hidden && !ctxEl.contains(e.target)) hideCtx(); });
function showCtx(n, x, y) {
  if (n.type !== "file" && n.type !== "folder") return;
  ctxEl.replaceChildren();
  const rec = ownedBy(n);
  const tb = document.createElement("div"); tb.className = "tb";
  const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = nameColor(n.name);
  const ttl = document.createElement("span"); ttl.className = "ttl"; ttl.textContent = n.name + (rec && rec.owner_name ? " - by " + rec.owner_name : "");
  tb.append(dot, ttl, mkBtn("\u00d7", "Close", hideCtx));
  const bd = document.createElement("div"); bd.className = "cb";
  ctxEl.append(tb, bd);
  if (isMine(rec) && canDelete(n)) {
    const rr = document.createElement("div"); rr.className = "ap";
    const ri = document.createElement("input"); ri.value = n.name; ri.maxLength = 120; ri.title = "New name"; rr.append(ri);
    const go = async () => { const v = ri.value; hideCtx(); await renameNode(n, v); };
    ri.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") go(); });
    rr.append(mkBtn("Rename", "", go)); bd.append(rr);
  }
  if (canDelete(n)) {
    let armed = false;
    const b = mkBtn("Delete " + n.type, "", async () => {
      if (!armed) { armed = true; b.textContent = n.type === "folder" ? "Click again: delete folder + contents" : "Click again to confirm"; return; }
      hideCtx(); await deleteNode(n);
    });
    b.className = "danger"; bd.append(b);
  } else {
    const d = document.createElement("div"); d.className = "t";
    d.textContent = !me ? "Log in to delete your own files." : shares.has(n.bucket + "/" + n.path) ? "Private: only the owner and approved people can open, edit or delete it." : "Only whoever created this can delete it.";
    bd.append(d);
  }
  if (n.type === "folder" && n.isHome && canDelete(n) && canRead(n.bucket, n.path)) {
    bd.append(mkBtn("Edit home", "Change the background, text and pictures", () => {
      hideCtx();
      if (!n.open) { n.open = true; SFX.play("folderOpen"); draw(); }
      openHomeEditor(n);
    }));
  }
  if (n.type === "folder" && isMine(rec) && canDelete(n) && distOk) {
    const cur = distRows.get(n.bucket + "/" + n.path);
    const h = document.createElement("div"); h.className = "t"; h.textContent = "District (colors this folder and what's in it):"; bd.append(h);
    const row = document.createElement("div"); row.className = "ap";
    const ci = document.createElement("input"); ci.type = "color"; ci.value = cur ? cur.color : "#4ec9b0"; ci.title = "District color";
    const li = document.createElement("input"); li.placeholder = "name (optional)"; li.maxLength = 24; li.value = cur && cur.label ? cur.label : "";
    li.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") setD(); });
    const setD = async () => { if (await shareCall("lattice_set_district", { p_bucket: n.bucket, p_path: n.path, p_color: ci.value, p_label: li.value.trim() })) showCtx(n, x, y); };
    row.append(ci, li, mkBtn(cur ? "Update" : "Set", "", setD));
    if (cur) row.append(mkBtn("Clear", "Remove the district", async () => { if (await shareCall("lattice_clear_district", { p_bucket: n.bucket, p_path: n.path })) showCtx(n, x, y); }));
    bd.append(row);
  }
  const sr = shares.get(n.bucket + "/" + n.path);
  if (isMine(rec) && sharesOk) {
    bd.append(mkBtn(sr ? "Make public" : "Make private", "Private: only you and people you approve can open, edit or delete it", async () => {
      hideCtx(); await shareCall("lattice_set_private", { p_bucket: n.bucket, p_path: n.path, p_on: !sr });
    }));
    if (sr) {
      const eds = sr.approved || [], vws = sr.viewers || [];
      const h = document.createElement("div"); h.className = "t";
      h.textContent = eds.length || vws.length ? "Approved people (viewer: open only, editor: open/edit/delete):" : "Nobody else is approved yet."; bd.append(h);
      const person = (a, role) => {
        const row = document.createElement("div"); row.className = "ap";
        const nm = document.createElement("span"); nm.textContent = a.name + " (" + role + ")"; row.append(nm);
        const own = { p_bucket: n.bucket, p_path: n.path };
        if (viewersOk) row.append(mkBtn(role === "editor" ? "\u2192 viewer" : "\u2192 editor", role === "editor" ? "Make them a viewer: can open but not edit or delete" : "Make them an editor: can open, edit and delete", async () => {
          const ok = role === "editor"
            ? await shareCall("lattice_approve_viewer", { ...own, p_user: a.name }) && await shareCall("lattice_unapprove", { ...own, p_uid: a.id })
            : await shareCall("lattice_approve", { ...own, p_user: a.name }) && await shareCall("lattice_unapprove_viewer", { ...own, p_uid: a.id });
          if (ok) showCtx(n, x, y);
        }));
        row.append(mkBtn("x", "Remove " + a.name, async () => { await shareCall(role === "editor" ? "lattice_unapprove" : "lattice_unapprove_viewer", { ...own, p_uid: a.id }); showCtx(n, x, y); }));
        bd.append(row);
      };
      eds.forEach(a => person(a, "editor")); vws.forEach(a => person(a, "viewer"));
      const row = document.createElement("div"); row.className = "ap";
      const inp = document.createElement("input"); inp.placeholder = "username to approve"; inp.maxLength = 16; row.append(inp);
      let sel = null;
      if (viewersOk) { sel = document.createElement("select"); sel.title = "Role"; sel.innerHTML = '<option value="viewer">Viewer</option><option value="editor">Editor</option>'; row.append(sel); }
      const go = async () => {
        const u = inp.value.trim(); if (!u) return;
        const fn = sel && sel.value === "viewer" ? "lattice_approve_viewer" : "lattice_approve";
        if (await shareCall(fn, { p_bucket: n.bucket, p_path: n.path, p_user: u })) showCtx(n, x, y);
      };
      inp.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") go(); });
      row.append(mkBtn("Approve", "", go)); bd.append(row);
    }
  } else if (sr) {
    const d = document.createElement("div"); d.className = "t"; d.textContent = "Private (owner: " + ((owners.get(n.bucket + "/" + n.path) || {}).owner_name || "?") + ")"; bd.append(d);
  }
  ctxEl.hidden = false;
  const r = ctxEl.getBoundingClientRect();
  ctxEl.style.left = Math.max(6, Math.min(innerWidth - r.width - 6, x)) + "px";
  ctxEl.style.top = Math.max(6, Math.min(innerHeight - r.height - 6, y)) + "px";
}

async function listAll(bucket, prefix) {            // every object under a folder, placeholders included
  const out = [];
  const walk = async p => {
    for (let off = 0; ; off += 200) {
      const { data, error } = await sb.storage.from(bucket).list(p, { limit: 200, offset: off, sortBy: { column: "name", order: "asc" } });
      if (error) throw error;
      for (const f of data) { const fp = p + "/" + f.name; if (f.id === null) await walk(fp); else out.push(fp); }
      if (data.length < 200) break;
    }
  };
  await walk(prefix);
  return out;
}
function closeGone(bucket, path, kind) {
  if (carry && carry.bucket === bucket && (kind === "file" ? carry.path === path : carry.path.startsWith(path + "/"))) setCarry(null);   // what I was holding is gone
  const base = "f:" + bucket + "/" + path, hb = "home:" + bucket + "/" + path;
  for (const k of [...wins.keys()]) if (k === base || k === hb || (kind === "folder" && (k.startsWith(base + "/") || k.startsWith(hb + "/")))) closeWin(k);
  if (kind === "folder") closeWin("upload");
}
async function deleteNode(n) {
  if (deleting || (n.type !== "file" && n.type !== "folder")) return;
  if (!me) { $("amsg").textContent = "Log in to delete your own files."; setMenu(true); return; }
  deleting = true;
  const label = n.type + " \"" + n.name + "\"";
  try {
    await loadOwners();
    if (!ownersOk) { msg.textContent = "Can't verify ownership right now, so nothing was deleted."; return; }
    if (!canDelete(n)) { msg.textContent = "You can only delete things you created or were approved to edit."; return; }
    let paths = [n.path];
    if (n.type === "folder") {
      paths = await listAll(n.bucket, n.path);
      const bad = paths.filter(p => !canEditPath(n.bucket, p)).length;
      if (bad) { msg.textContent = "Can't delete " + label + ": " + bad + (bad > 1 ? " things inside were" : " thing inside was") + " created by someone else."; return; }
    }
    const gone = [];
    for (let i = 0; i < paths.length; i += 100) {
      const { data, error } = await sb.storage.from(n.bucket).remove(paths.slice(i, i + 100));
      if (error) throw error;
      (data || []).forEach(d => gone.push(d.name));
    }
    if (gone.length < paths.length)
      msg.textContent = gone.length ? "Deleted " + gone.length + " of " + paths.length + " items; the server refused the rest."
        : "The server refused the delete. Did you run latticeos-accounts.sql?";
    if (!gone.length) return;
    closeGone(n.bucket, n.path, n.type);
    if (live && !n.isHome) chan.send({ type: "broadcast", event: "removed", payload: { bucket: n.bucket, path: n.path, kind: n.type, name: n.name.slice(0, 60), by: myName } });
    await refreshRoot();
    if (cine) pendingDraw = true; else draw();
    toast((n.type === "folder" ? "FOLDER DELETED  " : "FILE DELETED  ") + n.name);
  } catch (e) {
    msg.textContent = "Could not delete " + label + ": " + (e.message || e);
  } finally { deleting = false; }
}
async function renameNode(n, raw) {
  if (deleting || (n.type !== "file" && n.type !== "folder")) return;
  const nn = safeName(String(raw || "").trim());
  if (!String(raw || "").trim() || nn === n.name) return;
  if (!me) { $("amsg").textContent = "Log in to rename your own files."; setMenu(true); return; }
  if ((n.parent ? n.parent.children || [] : []).some(c => c !== n && c.name === nn)) { msg.textContent = "Something called \"" + nn + "\" already exists here."; return; }
  deleting = true;
  const cut = n.path.lastIndexOf("/") + 1, np = n.path.slice(0, cut) + nn;
  try {
    await loadOwners();
    if (!ownersOk) { msg.textContent = "Can't verify ownership right now, so nothing was renamed."; return; }
    if (!canDelete(n)) { msg.textContent = "You can only rename things you created."; return; }
    const paths = n.type === "folder" ? await listAll(n.bucket, n.path) : [n.path];
    if (paths.some(p => !canEditPath(n.bucket, p))) { msg.textContent = "Can't rename \"" + n.name + "\": something inside is private or made by someone else."; return; }
    let moved = 0;
    for (const p of paths) {
      const { error } = await sb.storage.from(n.bucket).move(p, np + p.slice(n.path.length));
      if (error) { msg.textContent = "Renamed " + moved + " of " + paths.length + " items, then: " + (error.message || error); break; }
      moved++;
    }
    if (!moved) return;
    if (moved === paths.length) {
      const base = n.bucket + "/" + n.path;
      if ([...shares.keys()].some(k => k === base || k.startsWith(base + "/")))
        await shareCall("lattice_move_private", { p_bucket: n.bucket, p_old: n.path, p_new: np });
      toast("RENAMED  " + n.name + " > " + nn);
    }
    closeGone(n.bucket, n.path, n.type);
    await refreshRoot();
    if (cine) pendingDraw = true; else draw();
  } catch (e) {
    msg.textContent = "Could not rename: " + (e.message || e);
  } finally { deleting = false; }
}
async function onRemoteRemoved(p) {
  if (!root || booting || !p || typeof p.bucket !== "string" || typeof p.path !== "string") return;
  const kind = p.kind === "folder" ? "folder" : "file";
  toast(String(p.by || "someone").slice(0, 16) + " deleted " + String(p.name || p.path.split("/").pop()).slice(0, 60));
  closeGone(p.bucket, p.path.slice(0, 400), kind);
  await refreshRoot();
  if (cine) { pendingDraw = true; return; }
  draw();
}

// ---- login / signup (username + password, no email) ----
const aSay = (t, bad) => { const e = $("amsg"); e.textContent = t || ""; e.style.color = bad ? "#ff0044" : ""; };
const guestName = () => GUEST;
function applyAuth(session) {
  const u = session && session.user;
  if (u ? (me && me.id === u.id) : !me) return;       // nothing changed (token refreshes land here)
  me = u ? { id: u.id, name: String(u.email || "").split("@")[0].slice(0, 16) } : null;
  $("acct-out").hidden = !!me; $("acct-in").hidden = !me;
  $("awho").textContent = me ? "Signed in as " + me.name : "";
  $("name").readOnly = true;
  myName = me ? me.name : guestName();
  $("name").value = myName;
  if (!me) { closeWin("upload"); hideCtx(); setCarry(null); }
  if (live) track();
  if (sb) (root ? refreshRoot() : loadOwners()).then(() => { if (root && !cine) draw(); });
  if (root && !cine) draw();
}
let authBusy = false;
async function doAuth(signup) {
  if (authBusy || !sb) return;
  $("ap").autocomplete = signup ? "new-password" : "current-password";
  const u = $("au").value.trim().toLowerCase(), p = $("ap").value;
  if (!/^[a-z0-9_]{3,16}$/.test(u)) { aSay("Username: 3-16 letters, numbers or underscores.", true); return; }
  if (p.length < 6) { aSay("Password needs at least 6 characters.", true); return; }
  authBusy = true; aSay(signup ? "creating account..." : "logging in...");
  try {
    const creds = { email: u + "@" + CFG.AUTH_DOMAIN, password: p };
    const { data, error } = signup ? await sb.auth.signUp(creds) : await sb.auth.signInWithPassword(creds);
    if (error) {
      const m = error.message || String(error);
      aSay(/already registered|already exists/i.test(m) ? "That username is taken."
        : /invalid login/i.test(m) ? "Wrong username or password (new here? click Sign up)."
        : /email/i.test(m) && /invalid/i.test(m) ? "Supabase rejected the generated address. Change CFG.AUTH_DOMAIN."
        : m, true);
    } else if (!data.session) {
      aSay("Account made, but Supabase wants email confirmation. Turn off \"Confirm email\" (Authentication > Providers > Email).", true);
    } else { $("ap").value = ""; aSay(""); applyAuth(data.session); }
  } catch (e) { aSay(e.message || String(e), true); }
  authBusy = false;
}
let renaming = false;
async function doRename() {
  if (renaming || !sb || !me) return;
  const u = $("newname").value.trim().toLowerCase();
  if (!/^[a-z0-9_]{3,16}$/.test(u)) { aSay("Username: 3-16 letters, numbers or underscores.", true); return; }
  if (u === me.name) { aSay("That's already your username.", true); return; }
  renaming = true; aSay("changing username...");
  try {
    const want = u + "@" + CFG.AUTH_DOMAIN;
    const { data, error } = await sb.auth.updateUser({ email: want });
    if (error) {
      const m = error.message || String(error);
      aSay(/already|exists|registered|taken|duplicate/i.test(m) ? "That username is taken." : m, true);
    } else if (!data.user || String(data.user.email || "").toLowerCase() !== want) {
      aSay("Supabase wants a confirmation for the change. Turn off \"Confirm email\" and \"Secure email change\" (Authentication > Providers > Email).", true);
    } else {
      me.name = u; myName = u;
      $("awho").textContent = "Signed in as " + u; $("name").value = u; $("newname").value = "";
      aSay("Username changed to " + u + ".");
      if (live) track();
      loadOwners().then(() => { if (root && !cine) draw(); });
    }
  } catch (e) { aSay(e.message || String(e), true); }
  renaming = false;
}
$("arename").onclick = doRename;
$("newname").addEventListener("keydown", e => { if (e.key === "Enter") doRename(); });
$("alogin").onclick = () => doAuth(false);
$("asign").onclick = () => doAuth(true);
$("alogout").onclick = async () => { try { await sb.auth.signOut({ scope: "local" }); } catch (e) {} applyAuth(null); aSay(""); };
["au", "ap"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") doAuth(false); }));
async function initAuth() {
  try {
    const { data } = await sb.auth.getSession();
    applyAuth(data.session);
    sb.auth.onAuthStateChange((ev, s) => setTimeout(() => applyAuth(s), 0));   // never call supabase inside this callback directly
  } catch (e) {}
}

// ---- start ----
(async function () {
  if (!CFG.URL || !CFG.KEY) {
    msg.textContent = "Open this file in a text editor and fill in CFG.URL and CFG.KEY at the top of the script.";
    appReady(); return;
  }
  if (typeof supabase === "undefined") {
    msg.textContent = "Could not load the Supabase library. Check your internet connection or ad blocker.";
    appReady(); return;
  }
  sb = supabase.createClient(CFG.URL, CFG.KEY);
  await initAuth();
  await loadOwners();
  startPresence();
  const name = CFG.NAME || new URL(CFG.URL).hostname.split(".")[0];
  root = mk(name, "root", "", "");
  root.open = true;
  draw(); fit();
  await load(root); draw(); fit();
  if (!root.children.length && !HOME) {
    if (!msg.textContent.startsWith("Could not"))
      msg.textContent = "No buckets were listed. Type your bucket name in the box at the top and press Add bucket.";
    $("bk").hidden = false; $("addbk").hidden = false;
    $("addbk").onclick = async () => {
      const name = $("bk").value.trim();
      if (!name) return;
      manual.push(name);
      root.children = null; await load(root); draw();
      await expandAll(root); fit();
    };
  }
  await expandAll(root); fit();
  follow = true; appReady();

  let busy = false;
  setInterval(async () => {
    if (busy || document.hidden) return;
    busy = true;
    try {
      if (!cine && await refreshRoot()) {
        if (cine) pendingDraw = true; else draw();
        msg.textContent = "Updated " + new Date().toLocaleTimeString();
      }
    } finally { busy = false; }
  }, REFRESH_MS);
})();
